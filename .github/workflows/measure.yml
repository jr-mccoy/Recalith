name: measure

# Native-platform measurements for the preview gate (ACCEPTANCE_TESTS §7): hook latency and
# usefulness in fresh interpreters (500 warm, 500 cold/missing packet, 50 first launches, the
# stale-cache, busy-writer, concurrent-hook, slow-fsync and Windows transient-rename cases) and the
# idle worker's CPU and memory over 10 minutes. Each platform is measured on its own runner and
# reported separately; nothing is extrapolated across platforms. Results are printed and uploaded.
# A dispatch may select runners and run only the worker measurement (typed-state attribution runs);
# a push always runs the full default set on every platform.

on:
  push:
    paths:
      - "src/recalith/fast/**"
      - "src/recalith/controller/worker.py"
      - "tools/measure_release_latency.py"
      - "tools/measure_worker_latency.py"
      - "tools/fixtures/hook_fault.py"
      - ".github/workflows/measure.yml"
  workflow_dispatch:
    inputs:
      runners:
        description: "JSON list of runners"
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      worker_only:
        description: "Skip the hook latency gate; run only the worker measurement"
        type: boolean
        default: false
      trials:
        description: "Typed-state trials"
        default: "20"
      idle_seconds:
        description: "Idle footprint window (seconds)"
        default: "600"

permissions:
  contents: read

# Measurements are long and compared across runs: a newer push waits for the older run instead of cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: measure (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.13
      - name: Hook latency and usefulness gate (fresh interpreters)
        if: ${{ !inputs.worker_only }}
        continue-on-error: true
        run: uv run --locked python tools/measure_release_latency.py --output measurements/release-latency-${{ runner.os }}.json
      - name: Idle worker footprint over 10 minutes (and typed-state latency)
        continue-on-error: true
        run: uv run --locked python tools/measure_worker_latency.py --trials ${{ inputs.trials || '20' }} --start-trials 5 --idle-seconds ${{ inputs.idle_seconds || '600' }} --output measurements/worker-${{ runner.os }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: measurements-${{ runner.os }}
          path: measurements/
          retention-days: 14
