name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# One run per branch: a newer push cancels the older run's remaining jobs (decision 0047).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.11.32"
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Schema snapshots have no unversioned drift
        run: uv run --locked python tools/generate_schemas.py --check
      - name: Hook wire validators match the strict contracts
        run: uv run --locked python tools/generate_hook_wire.py --check
      - name: requirements.lock matches uv.lock
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          { head -3 requirements.lock; uv export --locked --no-dev --no-emit-project --format requirements-txt -q | grep -v '^#'; } > /tmp/requirements.check
          diff -u requirements.lock /tmp/requirements.check
      - name: Tests
        run: uv run --locked python -m pytest -q -rs
      - name: Offline runtime provisioning from a hash-locked wheelhouse
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        shell: bash
        run: |
          uv build --wheel -o dist
          uv run --locked --with pip python tools/build_wheelhouse.py --out wheelhouses
          RECALITH_TEST_WHEEL=$(ls dist/recalith-*.whl) RECALITH_TEST_WHEELHOUSE=$(ls -d wheelhouses/wheelhouse-*) uv run --locked python -m pytest -q -rs tests/integration/test_installations.py -k bootstrap
