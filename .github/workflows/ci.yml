name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Schema snapshots have no unversioned drift
        run: uv run --locked python tools/generate_schemas.py --check
      - name: Unit tests
        run: uv run --locked python -m pytest -q
