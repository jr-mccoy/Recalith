[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "recalith"
version = "0.1.0.dev2"
description = "Autonomous, project-local memory: working state, episodes, and evidence-backed knowledge for one project."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.13,<3",
    "packaging>=24",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recalith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: requires a configured live host/provider route (never run in CI)",
]

[tool.uv]
required-version = ">=0.5"
