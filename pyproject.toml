[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "recalith"
version = "0.1.0.dev16"
description = "Autonomous, project-local memory: working state, episodes, and evidence-backed knowledge for one project."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.13,<3",
    "packaging>=24",
]
authors = [{ name = "Recalith contributors" }]
keywords = ["memory", "claude-code", "coding-agent", "knowledge-base", "sqlite", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/jr-mccoy/Recalith"
Issues = "https://github.com/jr-mccoy/Recalith/issues"
Documentation = "https://github.com/jr-mccoy/Recalith/blob/main/docs/OPERATIONS.md"

[project.scripts]
recalith = "recalith.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recalith"]

[tool.hatch.build.targets.sdist]
# What builds and installs the engine (decision 0047). Documents, evaluations, tests, tools, workflows
# and the design packet live in the repository, not in the source distribution.
include = ["/src/recalith", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml", "/bootstrap.py", "/requirements.lock", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: requires a configured live host/provider route (never run in CI)",
]

[tool.uv]
required-version = ">=0.5"
